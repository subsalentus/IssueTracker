<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Tracker - Minimal & Powerful Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header Principal -->
    <header class="top-navbar">
        <div class="brand-section">
            <div class="dropdown project-title-dropdown">
                <button class="project-title-btn" id="projectTitleBtn" onclick="toggleProjectTitleDropdown()">
                    <span class="project-title-icon">🚀</span>
                    <span id="currentProjectTitle" class="current-project-name">Carregando...</span>
                    <span class="dropdown-arrow">▾</span>
                </button>
                <div class="dropdown-menu project-dropdown-menu" id="projectTitleDropdown">
                    <div class="dropdown-header">Os Seus Projetos</div>
                    <div id="projectListItems" class="project-list-items"></div>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item" onclick="openNewProjectModal()">➕ Criar Novo Projeto</button>
                </div>
            </div>

            <button class="btn-icon" onclick="openProjectSettingsModal()" title="Definições do Projeto" style="margin-left: 4px;">⚙️</button>
        </div>

        <div class="header-actions">
            <button class="btn-primary" onclick="openCreateModal()" data-i18n="btn_new_task">+ Nova Tarefa</button>
            <button class="btn-secondary" onclick="toggleFilterBar()" id="toggleFilterBtn">
                <span class="filter-btn-icon">🔍</span> <span data-i18n="btn_filters">Filtros</span> <span id="filterActiveBadge" class="filter-badge" style="display: none;">0</span>
            </button>
            
            <div class="dropdown">
                <button id="actionsDropdownBtn" class="btn-secondary" onclick="toggleActionsDropdown()" data-i18n="btn_options">⚙️ Opções ▾</button>
                <div class="dropdown-menu" id="actionsDropdown">
                    <button class="dropdown-item" onclick="exportCSV()" data-i18n="export_csv">📥 Exportar CSV</button>
                    <label class="dropdown-item file-upload-label">
                        <span data-i18n="import_csv">📂 Importar CSV</span>
                        <input type="file" id="csvFileInput" accept=".csv" onchange="importCSV(event)" style="display: none;">
                    </label>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item text-danger" onclick="clearBoard()" data-i18n="clear_board">🗑️ Apagar Quadro</button>
                    <button class="dropdown-item text-danger" onclick="deleteCurrentProject()" data-i18n="delete_project">❌ Eliminar Projeto</button>
                </div>
            </div>

            <div class="dropdown">
                <button id="langSelectBtn" class="lang-select-btn" onclick="toggleLangDropdown()" title="Idioma / Language">
                    <span id="currentLangFlag">🇵🇹</span> <span id="currentLangText">PT</span> ▾
                </button>
                <div class="dropdown-menu" id="langDropdown">
                    <button class="dropdown-item" onclick="setLanguage('pt')">
                        <span style="font-size:16px; margin-right:6px;">🇵🇹</span> Português (PT)
                    </button>
                    <button class="dropdown-item" onclick="setLanguage('en')">
                        <span style="font-size:16px; margin-right:6px;">🇬🇧</span> English (EN)
                    </button>
                </div>
            </div>
            <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <!-- Layout com Navegação Lateral (Sidebar) -->
    <div class="app-layout">
        <!-- Sidebar Lateral de Navegação -->
        <aside class="sidebar-nav">
            <div class="sidebar-menu">
                <button class="sidebar-nav-item active" id="sidebarTabBoard" onclick="switchView('board')">
                    <span class="sidebar-icon">📊</span>
                    <span class="sidebar-label" data-i18n="nav_board">Quadro</span>
                </button>
                <button class="sidebar-nav-item" id="sidebarTabBacklog" onclick="switchView('backlog')">
                    <span class="sidebar-icon">📋</span>
                    <span class="sidebar-label" data-i18n="nav_backlog">Backlog</span>
                    <span id="backlogCountBadge" class="tab-badge">0</span>
                </button>
            </div>
        </aside>

        <!-- Área Principal de Conteúdo -->
        <main class="main-content-area">
            <!-- Barra de Filtros Expansível/Compacta -->
            <div class="filter-toolbar" id="filterToolbar">
                <div class="filter-row">
                    <input type="text" id="searchInput" placeholder="🔍 Pesquisar por título, ID..." oninput="onFilterChange()" class="search-input">
                    
                    <div class="filter-group">
                        <span>Épico:</span>
                        <select id="filterEpic" onchange="onFilterChange()">
                            <option value="Todos">Todos</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <span>Sprint/Release:</span>
                        <select id="filterSprint" onchange="onFilterChange()">
                            <option value="Todos">Todos</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <span>Tipo:</span>
                        <select id="filterType" onchange="onFilterChange()">
                            <option value="Todos">Todos</option>
                            <option value="Task">Task 📑</option>
                            <option value="Bug">Bug 🐛</option>
                            <option value="Story">Story 📖</option>
                            <option value="Epic">Epic ⚡</option>
                            <option value="Feature">Feature 🌟</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <span>Prioridade:</span>
                        <select id="filterPriority" onchange="onFilterChange()">
                            <option value="Todos">Todas</option>
                            <option value="Alta">Alta 🔴</option>
                            <option value="Média">Média 🟡</option>
                            <option value="Baixa">Baixa 🟢</option>
                        </select>
                    </div>

                    <button class="btn-text" onclick="resetFilters()">Limpar Filtros</button>
                </div>
            </div>

            <div class="board-wrapper" id="boardWrapper"></div>
            <div class="backlog-container" id="backlogViewContainer" style="display: none;"></div>
        </main>
    </div>

    <!-- Painel Lateral Deslizante para Detalhes da Tarefa (Side Drawer) -->
    <div class="drawer-overlay" id="taskModalOverlay" onclick="if(event.target===this) closeTaskModal()">
        <div class="task-drawer" id="taskDrawer">
            <div class="drawer-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <span id="taskDrawerIcon" style="font-size:22px;">📑</span>
                    <h3 class="modal-title" id="taskModalTitle" data-i18n="modal_edit_task_title">Detalhes da Tarefa</h3>
                </div>
                <button class="icon-btn" onclick="closeTaskModal()">✖️</button>
            </div>
            <div class="drawer-body">
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="width: 140px;">
                        <label data-i18n="label_type">Tipo</label>
                        <select id="taskType">
                            <option value="Task">Task 📑</option>
                            <option value="Bug">Bug 🐛</option>
                            <option value="Story">Story 📖</option>
                            <option value="Epic">Epic ⚡</option>
                            <option value="Feature">Feature 🌟</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label data-i18n="label_title">Título</label>
                        <input type="text" id="taskTitle" placeholder="Ex: Ajustar layout do menu" required>
                    </div>
                </div>

                <div class="form-group">
                    <label data-i18n="label_desc">Descrição</label>
                    <textarea id="taskDescription" rows="3" placeholder="Detalhes adicionais da tarefa..."></textarea>
                </div>

                <!-- Subtarefas Checklist -->
                <div class="form-group" id="subtasksSection">
                    <label data-i18n="label_subtasks">Subtarefas</label>
                    <div class="subtasks-list" id="modalSubtasksList"></div>
                    <div class="add-subtask-row">
                        <input type="text" id="newSubtaskInput" data-i18n-ph="subtask_ph" placeholder="Adicionar nova subtarefa..." style="flex:1;" onkeydown="if(event.key==='Enter') addSubtaskFromModal()">
                        <button class="btn-secondary" onclick="addSubtaskFromModal()" data-i18n="btn_add_subtask">+ Adicionar</button>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 140px;">
                        <label style="display:flex; justify-content:space-between; align-items:center;">
                            <span data-i18n="label_epic">Épico</span>
                            <a href="#" onclick="openCreateEpicPrompt(); return false;" style="font-size:11px; color:var(--primary); text-transform:none; font-weight:600; text-decoration:none;" data-i18n="btn_create_epic">+ Criar Épico</a>
                        </label>
                        <select id="taskEpic" onchange="handleTaskEpicChange(this.value)"></select>
                    </div>

                    <div class="form-group" style="flex: 1; min-width: 140px;">
                        <label data-i18n="label_sprint">Sprint / Release</label>
                        <select id="taskSprint"></select>
                    </div>

                    <div class="form-group" style="flex: 1; min-width: 120px;">
                        <label data-i18n="label_priority">Prioridade</label>
                        <select id="taskPriority">
                            <option value="Alta">Alta 🔴</option>
                            <option value="Média" selected>Média 🟡</option>
                            <option value="Baixa">Baixa 🟢</option>
                        </select>
                    </div>

                    <div class="form-group" style="width: 110px;">
                        <label data-i18n="label_story_points">Story Points</label>
                        <select id="taskStoryPoints">
                            <option value="1">1 pt</option>
                            <option value="2">2 pt</option>
                            <option value="3" selected>3 pt</option>
                            <option value="5">5 pt</option>
                            <option value="8">8 pt</option>
                            <option value="13">13 pt</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label data-i18n="label_assignee">Atribuído a</label>
                        <input type="text" id="taskAssignee" placeholder="Ex: Marcelo, Ana..." value="Marcelo">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label data-i18n="label_status">Coluna (Estado)</label>
                        <select id="taskStatus"></select>
                    </div>
                </div>

                <!-- Secção de Comentários / Discussão -->
                <div class="form-group" id="commentsSection" style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
                    <label data-i18n="label_comments" style="font-size:14px; font-weight:700;">💬 Comentários</label>
                    <div class="comments-list" id="drawerCommentsList"></div>
                    <div class="add-comment-box" style="margin-top:12px; display:flex; flex-direction:column; gap:8px;">
                        <textarea id="newCommentInput" rows="2" data-i18n-ph="comment_ph" placeholder="Escreva um comentário..." style="width:100%; resize:vertical;"></textarea>
                        <button class="btn-primary" style="align-self:flex-end; font-size:12px; padding:6px 14px;" onclick="addCommentFromDrawer()" data-i18n="btn_add_comment">Adicionar Comentário</button>
                    </div>
                </div>
            </div>
            <div class="drawer-footer">
                <button class="btn-danger" id="deleteTaskModalBtn" style="display: none;" onclick="deleteCurrentTask()" data-i18n="btn_delete">🗑️ Eliminar</button>
                <div style="display: flex; gap: 8px; margin-left: auto;">
                    <button class="btn-secondary" onclick="closeTaskModal()" data-i18n="btn_cancel">Cancelar</button>
                    <button class="btn-primary" onclick="saveTaskModal()" data-i18n="btn_save">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Definições do Projeto -->
    <div class="modal-overlay" id="projectSettingsModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="projectSettingsTitle">⚙️ Definições do Projeto</h3>
                <button class="icon-btn" onclick="closeProjectSettingsModal()">✖️</button>
            </div>
            <div class="modal-body">
                <!-- Informações do Projeto -->
                <div class="settings-section">
                    <h4 class="settings-section-title">📌 Dados Gerais do Projeto</h4>
                    <div style="display: flex; gap: 12px;">
                        <div class="form-group" style="width: 120px;">
                            <label>Chave (ID)</label>
                            <input type="text" id="settingsProjectKey" disabled style="background: var(--bg-board); font-weight:700;">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Nome do Projeto</label>
                            <input type="text" id="settingsProjectName">
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 8px;">
                        <label>Descrição</label>
                        <textarea id="settingsProjectDesc" rows="3"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeProjectSettingsModal()">Cancelar</button>
                <button class="btn-primary" onclick="saveProjectDetails()">Guardar Alterações</button>
            </div>
        </div>
    </div>

    <!-- Modal de Criar Novo Projeto -->
    <div class="modal-overlay" id="newProjectModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Criar Novo Projeto</h3>
                <button class="icon-btn" onclick="closeNewProjectModal()">✖️</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Chave do Projeto (ID Prefix)</label>
                    <input type="text" id="newProjectKey" placeholder="Ex: MOB, WEB, API..." maxlength="6" style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label>Nome do Projeto</label>
                    <input type="text" id="newProjectName" placeholder="Ex: Aplicação Mobile iOS/Android">
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="newProjectDesc" rows="2" placeholder="Descrição rápida do projeto..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <div></div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-secondary" onclick="closeNewProjectModal()">Cancelar</button>
                    <button class="btn-primary" onclick="saveNewProjectModal()">Criar Projeto</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/state.js"></script>
    <script src="js/epics.js"></script>
    <script src="js/sprints.js"></script>
    <script src="js/board.js"></script>
    <script src="js/backlog.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/app.js"></script>
</body>

</html>

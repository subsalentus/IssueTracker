<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Tracker - App Trilhos Portugal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header Principal -->
    <header class="app-header">
        <h1 class="app-title">
            <span>🚀</span> App Trilhos Portugal - Issue Tracker
        </h1>
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()">🌙 Modo Escuro</button>
    </header>

    <!-- Painel de Controlos -->
    <div class="header-panel">
        <!-- Linha de Filtros e Ferramentas -->
        <div class="controls-row">
            <div class="filter-group">
                <span>👁️ Épico:</span>
                <select id="filterEpic" onchange="renderBoard()" style="border: none; background: transparent; font-weight: 600; padding: 0;">
                    <option value="Todos">Todos os Épicos</option>
                </select>
            </div>

            <div class="filter-group">
                <span>⚡ Prioridade:</span>
                <select id="filterPriority" onchange="renderBoard()" style="border: none; background: transparent; font-weight: 600; padding: 0;">
                    <option value="Todos">Todas as Prioridades</option>
                    <option value="Alta">Alta 🔴</option>
                    <option value="Média">Média 🟡</option>
                    <option value="Baixa">Baixa 🟢</option>
                </select>
            </div>

            <input type="text" id="searchInput" placeholder="🔍 Pesquisar tarefas por título, ID..." oninput="renderBoard()" style="flex: 1; min-width: 200px;">

            <button class="btn-secondary" onclick="exportCSV()" title="Exportar dados para CSV">📥 Exportar CSV</button>
            
            <label class="btn-secondary file-upload-label" title="Importar ficheiro CSV">
                📂 Importar CSV
                <input type="file" id="csvFileInput" accept=".csv" onchange="importCSV(event)" style="display: none;">
            </label>
            
            <button class="btn-danger" onclick="clearBoard()">Apagar Tudo</button>
        </div>

        <div style="height: 1px; background: var(--border); width: 100%;"></div>

        <!-- Linha de Criação de Tarefa -->
        <div class="controls-row">
            <input type="text" id="newTitle" placeholder="O que precisa de ser feito?" required style="flex: 2; min-width: 260px;" onkeydown="if(event.key==='Enter') addTicket()">
            
            <select id="newEpic" style="flex: 1; min-width: 180px;">
                <option value="Epic 1: Geoespacial">Epic 1: Geoespacial</option>
                <option value="Epic 2: Backend">Epic 2: Backend</option>
                <option value="Epic 3: Hardware/Navegação">Epic 3: Hardware/Navegação</option>
                <option value="Outro">Outro</option>
            </select>

            <select id="newPriority" style="width: 130px;">
                <option value="Alta">Alta 🔴</option>
                <option value="Média" selected>Média 🟡</option>
                <option value="Baixa">Baixa 🟢</option>
            </select>

            <button class="btn-primary" onclick="addTicket()">+ Adicionar Tarefa</button>
        </div>
    </div>

    <!-- Quadro Kanban -->
    <div class="board">
        <!-- Coluna To Do -->
        <div class="column" id="todo" ondragenter="dragEnter(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
            <div class="column-header">
                <span>To Do</span>
                <span class="issue-count" id="count-todo">0</span>
            </div>
            <div class="tickets-container" id="container-todo"></div>
        </div>

        <!-- Coluna In Progress -->
        <div class="column" id="in-progress" ondragenter="dragEnter(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
            <div class="column-header">
                <span>In Progress</span>
                <span class="issue-count" id="count-in-progress">0</span>
            </div>
            <div class="tickets-container" id="container-in-progress"></div>
        </div>

        <!-- Coluna Done -->
        <div class="column" id="done" ondragenter="dragEnter(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
            <div class="column-header">
                <span>Done</span>
                <span class="issue-count" id="count-done">0</span>
            </div>
            <div class="tickets-container" id="container-done"></div>
        </div>
    </div>

    <!-- Modal de Edição de Tarefa -->
    <div class="modal-overlay" id="editModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Editar Tarefa (<span id="modalId">TRL-0</span>)</h3>
                <button class="icon-btn" onclick="closeModal()">✖️</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="editTitle" placeholder="Título da tarefa">
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="editDescription" rows="3" placeholder="Descrição detalhada da tarefa..."></textarea>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Épico</label>
                        <select id="editEpic">
                            <option value="Epic 1: Geoespacial">Epic 1: Geoespacial</option>
                            <option value="Epic 2: Backend">Epic 2: Backend</option>
                            <option value="Epic 3: Hardware/Navegação">Epic 3: Hardware/Navegação</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Prioridade</label>
                        <select id="editPriority">
                            <option value="Alta">Alta 🔴</option>
                            <option value="Média">Média 🟡</option>
                            <option value="Baixa">Baixa 🟢</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="editStatus">
                        <option value="todo">To Do</option>
                        <option value="in-progress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-danger" onclick="deleteTicket(currentEditingId)">🗑️ Eliminar</button>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button class="btn-primary" onclick="saveEditModal()">Guardar Alterações</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
